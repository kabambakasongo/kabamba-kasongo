<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page introuvable — KABAMBA KASONGO</title>
    <meta
      name="description"
      content="Portfolio de KABAMBA KASONGO, développeur Full-Stack basé à Kolwezi, République Démocrative du Congo."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="__BASE_URL__favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --canvas: #0a0b0d;
        --surface: #111317;
        --line: rgb(255 255 255 / 0.09);
        --ink: #eceef1;
        --muted: #a2a8b2;
        --subtle: #767d88;
        --brand: #ff8a4c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--canvas);
        color: var(--ink);
        font-family:
          'Inter',
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        position: relative;
        width: 100%;
        max-width: 34rem;
        padding: 3rem;
        border: 1px solid var(--line);
        border-radius: 1.75rem;
        background: var(--surface);
        text-align: center;
        overflow: hidden;
      }
      .wrap::before {
        content: '';
        position: absolute;
        inset: -40% 40% 55% -20%;
        background: radial-gradient(circle, rgb(255 138 76 / 0.35), transparent 70%);
        pointer-events: none;
      }
      .code {
        font-family: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
        font-size: 4.5rem;
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(100deg, var(--brand), #ffb020);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 auto;
        max-width: 26rem;
        color: var(--muted);
        line-height: 1.65;
        font-size: 0.95rem;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 2rem;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.7rem 1.25rem;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 500;
        text-decoration: none;
        border: 1px solid var(--line);
        color: var(--ink);
        transition:
          border-color 0.25s ease,
          transform 0.25s ease;
      }
      a.button:hover {
        border-color: var(--brand);
        transform: translateY(-2px);
      }
      a.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: #140b06;
      }
      .meta {
        margin-top: 2.5rem;
        font-family: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--subtle);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <p class="code">404</p>
      <h1>Cette page n’existe pas</h1>
      <p>
        Le lien que vous avez suivi est introuvable. Retournez au portfolio pour découvrir mes
        projets, mes compétences et mes services.
      </p>
      <div class="links">
        <a class="button primary" href="__BASE_URL__">Retour au portfolio</a>
        <a class="button" href="__BASE_URL__#contact">Me contacter</a>
      </div>
      <p class="meta">KABAMBA KASONGO · Full-Stack Developer · Kolwezi, RDC</p>
    </main>
  </body>
</html>
