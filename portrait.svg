<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12141a" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a45" />
      <stop offset="100%" stop-color="#ffb020" />
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.12" />
    </pattern>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0%" stop-color="#ff7a45" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#ff7a45" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)" />
  <rect width="800" height="800" fill="url(#dots)" />
  <rect width="800" height="800" fill="url(#glow)" />

  <g transform="translate(400 340)">
    <circle r="150" fill="url(#brand)" fill-opacity="0.14" />
    <circle r="150" fill="none" stroke="url(#brand)" stroke-width="2" stroke-opacity="0.7" />
    <g stroke="#0a0b0d" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-40 -55v110" />
      <path d="M-40 0l32-32M-40 0l32 32" />
      <path d="M40 -55v110" />
      <path d="M40 0l32-32M40 0l32 32" />
    </g>
  </g>

  <text
    x="400"
    y="580"
    text-anchor="middle"
    font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif"
    font-size="58"
    font-weight="700"
    letter-spacing="6"
    fill="#eceef1"
  >KABAMBA</text>
  <text
    x="400"
    y="640"
    text-anchor="middle"
    font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif"
    font-size="58"
    font-weight="700"
    letter-spacing="6"
    fill="url(#brand)"
  >KASONGO</text>
  <text
    x="400"
    y="700"
    text-anchor="middle"
    font-family="'JetBrains Mono', 'Courier New', monospace"
    font-size="24"
    letter-spacing="8"
    fill="#a2a8b2"
  >FULL-STACK DEVELOPER</text>
</svg>
